<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradDarkCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed573"/>
      <stop offset="100%" stop-color="#4a69bd"/>
    </linearGradient>
    <linearGradient id="gradHojaDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ed573"/>
      <stop offset="60%" stop-color="#10ac84"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ISOTIPO DARK -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="50" r="48" fill="#1e293b" stroke="url(#gradDarkCircle)" stroke-width="3.5"/>
    <path d="M 50 14 C 28 32, 22 66, 50 86 C 78 66, 72 32, 50 14 Z" fill="url(#gradHojaDark)" opacity="0.95"/>
    <path d="M 50 20 L 50 80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 50 35 L 36 46 M 50 48 L 32 60 M 50 62 L 38 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 50 35 L 64 46 M 50 48 L 68 60 M 50 62 L 62 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="36" cy="46" r="3.5" fill="#ffffff" filter="url(#glowDark)"/>
    <circle cx="64" cy="46" r="3.5" fill="#ffffff" filter="url(#glowDark)"/>
    <circle cx="32" cy="60" r="3.5" fill="#ffffff" filter="url(#glowDark)"/>
    <circle cx="68" cy="60" r="3.5" fill="#ffffff" filter="url(#glowDark)"/>
    <circle cx="50" cy="22" r="4" fill="#f1c40f" filter="url(#glowDark)"/>
    <path d="M 42 22 Q 50 17 58 22 Q 50 20 42 22 Z" fill="#4a69bd"/>
    <ellipse cx="45" cy="18" rx="7" ry="2" fill="#74b9ff" opacity="0.9" transform="rotate(-15 45 18)"/>
    <ellipse cx="55" cy="18" rx="7" ry="2" fill="#74b9ff" opacity="0.9" transform="rotate(15 55 18)"/>
  </g>

  <!-- TIPOGRAFÍA DARK -->
  <g transform="translate(125, 42)">
    <text x="0" y="16" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#f8fafc" letter-spacing="0.5">ALGORITMO</text>
    <text x="165" y="16" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#2ed573" letter-spacing="0.5">VERDE</text>
    <text x="266" y="16" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#f1c40f" letter-spacing="1">YT</text>
    <text x="2" y="40" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#94a3b8" letter-spacing="0.2">
      Manejo Integrado de Arenillas · YOSW 2026
    </text>
    <text x="2" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#2ed573" letter-spacing="0.3">
      Ciencia Interdisciplinar &amp; Bienestar Universitario
    </text>
  </g>
</svg>